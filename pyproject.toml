[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ksef-cli"
version = "0.1.0"
description = "CLI tool for the Polish National e-Invoice System (KSeF)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "anthropic>=0.30",
    "pydantic>=2.7",
    "lxml>=5.2",
    "rich>=13",
    "tomli-w>=1.0",
]

[project.scripts]
ksef = "ksef.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["ksef"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
